[package]
name = "runas-rs"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["João Victor"]
description = "Run Windows commands with alternate user credentials"
repository = "https://github.com/joaoviictorti/runas"
homepage = "https://github.com/joaoviictorti/runas"
documentation = "https://docs.rs/runas-rs/latest"
readme = "README.md"
keywords = ["runas", "windows", "rust", "redteam"]
categories = ["os", "security"]
rust-version = "1.85"
include = [
  "src/**",
  "Cargo.toml",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[dependencies]
anyhow = { version = "1.0.97", default-features = false }
bitflags = "2.10.0"

[dependencies.windows-sys]
version = "0.59.0"
features = [
  "Win32_Security_Authentication_Identity",
  "Win32_Storage_FileSystem",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_SystemServices",
]

[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = [
  "x86_64-pc-windows-gnu",
  "x86_64-pc-windows-msvc",
  "i686-pc-windows-gnu",
  "i686-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
